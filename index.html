<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Toque & Appareils</title>
<link rel="stylesheet" href="style.css">

<!-- AJOUT PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2d4a3e">
<!-- FIN AJOUT -->

</head>
<body>

<div class="conteneur">
  <img src="fond_crop.png" class="fond-behind" alt="Ambiance cuisine">

  <div class="contenu">
    <h1>🍳 Toque & Appareils</h1>

    <div class="bloc-recherche">
      <input type="text" id="recherche" placeholder="Tapez un aliment ou un mot-clé...">

      <div class="bandeau-clic">
        <img src="bandeau_crop.png" class="bandeau-img" alt="Appareils de cuisine">
        <button class="zone-clic zone-0" data-mot="recette air fryer" data-nom="🌀 Air Fryer"></button>
        <button class="zone-clic zone-1" data-mot="recette Cookeo" data-nom="⏲️ Cookéo"></button>
        <button class="zone-clic zone-2" data-mot="recette Monsieur Cuisine" data-nom="🥘 Monsieur Cuisine"></button>
        <button class="zone-clic zone-3" data-mot="recette four" data-nom="🔥 Four"></button>
        <button class="zone-clic zone-4" data-mot="recette casserole" data-nom="🍲 Casserole"></button>
      </div>

      <div class="noms-appareils">
        <span>Air Fryer</span><span>Cookéo</span><span>M. Cuisine</span><span>Four</span><span>Casserole</span>
      </div>
    </div>

    <div class="bloc-sauvegarde">
      <h2>💾 Sauvegarder une recette trouvée</h2>
      <form id="formSauvegarde">
        <select id="appareilSauvegarde">
          <option value="🥘 Monsieur Cuisine">🥘 Monsieur Cuisine</option>
          <option value="⏲️ Cookéo">⏲️ Cookéo</option>
          <option value="🌀 Air Fryer">🌀 Air Fryer</option>
          <option value="🔥 Four">🔥 Four</option>
          <option value="🍲 Casserole">🍲 Casserole</option>
        </select>
        <input type="text" id="titreRecette" placeholder="Titre de la recette">
        <input type="text" id="urlRecette" placeholder="Lien (URL) de la recette">
        <button type="submit">Enregistrer ⭐</button>
        <p id="messageSauvegarde"></p>
      </form>
    </div>

    <a href="recettes.html" class="lien-mes-recettes">⭐ Voir Mes recettes</a>
  </div>
</div>

<script src="storage.js"></script>
<script src="script.js"></script>

<!-- AJOUT PWA : enregistrement du Service Worker -->
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js').then((reg) => {
    reg.onupdatefound = () => {
      const newWorker = reg.installing;
      newWorker.onstatechange = () => {
        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          if (confirm("Une nouvelle version est disponible. Mettre à jour maintenant ?")) {
            newWorker.postMessage("SKIP_WAITING");
            window.location.reload();
          }
        }
      };
    };
  });
}
</script>
<!-- FIN AJOUT -->

</body>
</html>
