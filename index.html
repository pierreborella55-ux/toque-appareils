<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toque & Appareils</title>
<link rel="stylesheet" href="style.css">

<!-- AJOUT PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2d4a3e">
<!-- FIN AJOUT -->

</head>
<body>

<!-- ===== AJOUT : Bannière de mise à jour ===== -->
<div id="bandeauMiseAJour" class="bandeau-maj">
  <span>🔄 Nouvelle version disponible</span>
  <button id="btnMettreAJour">Mettre à jour</button>
</div>
<!-- ===== FIN AJOUT ===== -->

<div class="conteneur">
  <img src="fond_crop.png" class="fond-behind" alt="Ambiance cuisine">

  <a href="parametres.html" class="btn-roue-parametres" title="Paramètres">⚙️</a>

  <div class="contenu">
    <h1>🍳 Toque & Appareils</h1>

    <div class="bloc-recherche">
      <input type="text" id="recherche" placeholder="Tapez un aliment ou un mot-clé...">

      <div id="zoneIcones" class="zone-icones"></div>
    </div>

    <div class="bloc-sauvegarde">
      <h2>💾 Sauvegarder une recette trouvée</h2>
      <form id="formSauvegarde">
        <select id="appareilSauvegarde"></select>
        <input type="text" id="titreRecette" placeholder="Titre de la recette">
        <input type="text" id="urlRecette" placeholder="Lien (URL) de la recette">
        <button type="submit">Enregistrer ⭐</button>
        <p id="messageSauvegarde"></p>
      </form>
    </div>

    <div class="conteneur-lien-recettes">
      <a href="recettes.html" class="lien-mes-recettes">⭐ Voir Mes recettes</a>
      <span id="badgeRecettes" class="badge-recettes"></span>
    </div>

  </div>
</div>

<script src="storage.js"></script>
<script src="script.js"></script>

<!-- AJOUT PWA : enregistrement du Service Worker -->
<script>
if ('serviceWorker' in navigator) {
  // ===== MODIFIÉ : updateViaCache "none" pour forcer le navigateur
  //      (notamment Android) à toujours vérifier une version fraîche
  //      du fichier service-worker.js, et ne plus se fier à une copie
  //      mise en cache par le navigateur lui-même =====
  navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).then((reg) => {
    reg.update();

    // ===== AJOUT : si une mise à jour était déjà prête mais pas encore
    //      activée (par ex. app fermée avant d'avoir cliqué sur le bouton
    //      la fois précédente), on affiche quand même la bannière =====
    if (reg.waiting) {
      afficherBandeauMiseAJour(reg.waiting);
    }
    // ===== FIN AJOUT =====

    reg.onupdatefound = () => {
      const newWorker = reg.installing;
      newWorker.onstatechange = () => {
        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          afficherBandeauMiseAJour(newWorker);
        }
      };
    };
  });

  // ===== AJOUT : fonction commune pour afficher la bannière =====
  function afficherBandeauMiseAJour(worker) {
    const bandeau = document.getElementById('bandeauMiseAJour');
    const btn = document.getElementById('btnMettreAJour');
    if (bandeau && btn) {
      bandeau.classList.add('visible');
      btn.addEventListener('click', () => {
        worker.postMessage("SKIP_WAITING");
        window.location.reload();
      });
    }
  }
  // ===== FIN AJOUT =====
}
</script>
<!-- FIN AJOUT -->

</body>
</html>
