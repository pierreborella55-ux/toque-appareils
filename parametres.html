<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paramètres - Toque & Appareils</title>
<link rel="stylesheet" href="style.css">

<!-- AJOUT PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2d4a3e">
<!-- FIN AJOUT -->

</head>
<body>

<!-- ===== AJOUT : Bannière de mise à jour ===== -->
<div id="bandeauMiseAJour" class="bandeau-maj">
  <span>🔄 Nouvelle version disponible</span>
  <button id="btnMettreAJour">Mettre à jour</button>
</div>
<!-- ===== FIN AJOUT ===== -->

<div class="conteneur">
  <img src="fond_crop.png" class="fond-behind" alt="Ambiance cuisine">

  <div class="contenu">

    <div class="entete-page">
      <a href="index.html" class="btn-retour-fleche">← Retour</a>
      <h1>⚙️ Paramètres</h1>
    </div>

    <!-- ===== NOUVEAU : menu principal des paramètres ===== -->
    <div class="menu-parametres">
      <a href="parametres-appareils.html" class="item-menu-parametres">
        🔧 Appareils
        <span class="fleche">→</span>
      </a>
      <a href="parametres-courses.html" class="item-menu-parametres">
        🛒 Liste de courses
        <span class="fleche">→</span>
      </a>
      <a href="parametres-affichage.html" class="item-menu-parametres">
        🌓 Affichage
        <span class="fleche">→</span>
      </a>
      <a href="apropos.html" class="item-menu-parametres">
        ℹ️ À propos
        <span class="fleche">→</span>
      </a>
    </div>
    <!-- ===== FIN NOUVEAU ===== -->

  </div>
</div>

<!-- AJOUT PWA : enregistrement du Service Worker -->
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).then((reg) => {
    reg.update();

    if (reg.waiting) {
      afficherBandeauMiseAJour(reg.waiting);
    }

    reg.onupdatefound = () => {
      const newWorker = reg.installing;
      newWorker.onstatechange = () => {
        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          afficherBandeauMiseAJour(newWorker);
        }
      };
    };
  });

  function afficherBandeauMiseAJour(worker) {
    const bandeau = document.getElementById('bandeauMiseAJour');
    const btn = document.getElementById('btnMettreAJour');
    if (bandeau && btn) {
      bandeau.classList.add('visible');
      btn.addEventListener('click', () => {
        worker.postMessage("SKIP_WAITING");
        window.location.reload();
      });
    }
  }
}
</script>
<!-- FIN AJOUT -->

</body>
</html>
