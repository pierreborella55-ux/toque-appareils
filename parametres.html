<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paramètres - Toque & Appareils</title>
<link rel="stylesheet" href="style.css">

<!-- AJOUT PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2d4a3e">
<!-- FIN AJOUT -->

</head>
<body>

<!-- ===== AJOUT : Bannière de mise à jour ===== -->
<div id="bandeauMiseAJour" class="bandeau-maj">
  <span>🔄 Nouvelle version disponible</span>
  <button id="btnMettreAJour">Mettre à jour</button>
</div>
<!-- ===== FIN AJOUT ===== -->

<div class="conteneur">
  <img src="fond_crop.png" class="fond-behind" alt="Ambiance cuisine">

  <div class="contenu">

    <div class="entete-page">
      <a href="index.html" class="btn-retour-fleche">← Retour</a>
      <h1>⚙️ Paramètres</h1>
    </div>

    <div class="barre-onglets">
      <button class="btn-onglet actif" data-onglet="onglet-appareils">🔧 Appareils</button>
      <button class="btn-onglet" data-onglet="onglet-courses">🛒 Courses</button>
      <button class="btn-onglet" data-onglet="onglet-affichage">🌓 Affichage</button>
    </div>

    <!-- ===== ONGLET APPAREILS ===== -->
    <div id="onglet-appareils" class="contenu-onglet actif">

      <div id="listeAppareils"></div>

      <div class="bloc-ajout-appareil">
        <h2>➕ Ajouter un appareil</h2>
        <input type="text" id="nouvelAppareilNom" placeholder="Nom de l'appareil">

        <div class="ligne-boutons-photo">
          <label class="btn-photo-appareil">
            📷 Prendre une photo
            <input type="file" accept="image/*" capture="environment" id="nouvelAppareilPhotoCamera" style="display:none;">
          </label>
          <label class="btn-photo-appareil">
            🖼️ Galerie
            <input type="file" accept="image/*" id="nouvelAppareilPhotoGalerie" style="display:none;">
          </label>
        </div>
        <div id="previewNouvelAppareil"></div>

        <button id="btnAjouterAppareil">Ajouter l'appareil</button>
        <p id="messageAjoutAppareil"></p>
      </div>

    </div>

    <!-- ===== ONGLET LISTE DE COURSES ===== -->
    <div id="onglet-courses" class="contenu-onglet">

      <div class="bloc-ajout-course">
        <input type="text" id="nouvelArticleCourse" placeholder="Ajouter un article...">
        <button id="btnAjouterArticleCourse">➕ Ajouter</button>
      </div>

      <div id="listeCourses"></div>

      <div class="ligne-boutons-courses">
        <button id="btnNettoyerCourses">🧹 Nettoyer les cochés</button>
        <button id="btnViderCourses">🗑️ Tout vider</button>
      </div>

    </div>

    <!-- ===== ONGLET AFFICHAGE (thème) ===== -->
    <div id="onglet-affichage" class="contenu-onglet">

      <div class="bloc-theme">
        <h2>🌓 Apparence de l'application</h2>

        <div class="choix-theme">
          <button id="btnThemeSombre" class="btn-theme">
            🌙 Mode sombre
          </button>
          <button id="btnThemeClair" class="btn-theme">
            ☀️ Mode clair
          </button>
        </div>
      </div>

    </div>

  </div>
</div>

<script src="storage.js"></script>
<script src="parametres.js"></script>

<!-- AJOUT PWA : enregistrement du Service Worker -->
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).then((reg) => {
    reg.update();

    if (reg.waiting) {
      afficherBandeauMiseAJour(reg.waiting);
    }

    reg.onupdatefound = () => {
      const newWorker = reg.installing;
      newWorker.onstatechange = () => {
        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          afficherBandeauMiseAJour(newWorker);
        }
      };
    };
  });

  function afficherBandeauMiseAJour(worker) {
    const bandeau = document.getElementById('bandeauMiseAJour');
    const btn = document.getElementById('btnMettreAJour');
    if (bandeau && btn) {
      bandeau.classList.add('visible');
      btn.addEventListener('click', () => {
        worker.postMessage("SKIP_WAITING");
        window.location.reload();
      });
    }
  }
}
</script>
<!-- FIN AJOUT -->

</body>
</html>
