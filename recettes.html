<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes recettes - Toque & Appareils</title>
<link rel="stylesheet" href="style.css">

<!-- AJOUT PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2d4a3e">
<!-- FIN AJOUT -->

</head>
<body>

<!-- ===== AJOUT : Bannière de mise à jour ===== -->
<div id="bandeauMiseAJour" class="bandeau-maj">
  <span>🔄 Nouvelle version disponible</span>
  <button id="btnMettreAJour">Mettre à jour</button>
</div>
<!-- ===== FIN AJOUT ===== -->

<div class="conteneur">
  <img src="fond_crop.png" class="fond-behind" alt="Ambiance cuisine">

  <div class="contenu">
    <h1>⭐ Mes recettes</h1>

    <div class="bloc-filtre">
      <input type="text" id="rechercheInterne" placeholder="Rechercher dans mes recettes...">
      <select id="filtreAppareil"></select>
    </div>

    <!-- AJOUT : Export / Import -->
    <div class="bloc-export-import">
      <button id="btnExporter" class="btn-export">📤 Exporter mes recettes</button>
      <label for="inputImporter" class="btn-import">📥 Importer des recettes</label>
      <input type="file" id="inputImporter" accept=".json" style="display:none;">
      <p id="messageImportExport"></p>
    </div>
    <!-- FIN AJOUT -->

    <div id="listeRecettes"></div>

    <a href="index.html" class="lien-mes-recettes">← Retour à la recherche</a>
  </div>
</div>

<script src="storage.js"></script>
<script src="recettes.js"></script>

<!-- AJOUT PWA : enregistrement du Service Worker -->
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).then((reg) => {
    reg.update();

    if (reg.waiting) {
      afficherBandeauMiseAJour(reg.waiting);
    }

    reg.onupdatefound = () => {
      const newWorker = reg.installing;
      newWorker.onstatechange = () => {
        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          afficherBandeauMiseAJour(newWorker);
        }
      };
    };
  });

  function afficherBandeauMiseAJour(worker) {
    const bandeau = document.getElementById('bandeauMiseAJour');
    const btn = document.getElementById('btnMettreAJour');
    if (bandeau && btn) {
      bandeau.classList.add('visible');
      btn.addEventListener('click', () => {
        worker.postMessage("SKIP_WAITING");
        window.location.reload();
      });
    }
  }
}
</script>
<!-- FIN AJOUT -->

</body>
</html>
